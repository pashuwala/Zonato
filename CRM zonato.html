<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SaaS CRM - Pashuwala Agrotech</title><!-- Firebase CDN --><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script><style>
body{margin:0;font-family:Inter;background:#0b0b0c;color:#fff}
.container{max-width:1000px;margin:auto;padding:20px}
input,select{width:100%;padding:10px;margin-top:10px;background:#111;border:1px solid #333;color:#fff;border-radius:8px}
button{padding:10px;background:#fff;color:#000;border:none;border-radius:8px;margin-top:10px;cursor:pointer}
.card{background:#111;padding:15px;border-radius:12px;margin-top:15px;border:1px solid #333}
.table{width:100%;margin-top:10px;border-collapse:collapse}
.table td,.table th{padding:10px;border-bottom:1px solid #333}
.badge{padding:5px 10px;border-radius:20px}
.hot{background:#fff;color:#000}
.warm{background:#ccc;color:#000}
.cold{background:#777;color:#000}
</style></head>
<body><div class="container">
<h2>SaaS CRM (Cloud + Login)</h2><div id="auth">
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
</div><div id="app" style="display:none">
<button onclick="logout()">Logout</button><div class="card">
<h3>Add Lead</h3>
<input id="name" placeholder="Name">
<input id="phone" placeholder="Phone">
<select id="status">
<option value="hot">Hot</option>
<option value="warm">Warm</option>
<option value="cold">Cold</option>
</select>
<button onclick="addLead()">Save</button>
</div><div class="card">
<h3>Leads</h3>
<table class="table" id="table"></table>
</div>
</div>
</div><script>
// 🔥 YOUR FIREBASE CONFIG (replace this)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// AUTH
function signup(){
auth.createUserWithEmailAndPassword(email.value,password.value);
}

function login(){
auth.signInWithEmailAndPassword(email.value,password.value);
}

function logout(){auth.signOut();}

auth.onAuthStateChanged(user=>{
if(user){
  auth.style.display='none';
  app.style.display='block';
  loadLeads();
}else{
  auth.style.display='block';
  app.style.display='none';
}
});

// CRM
function addLead(){
db.collection('leads').add({
name:name.value,
phone:phone.value,
status:status.value,
time:Date.now()
});
}

function loadLeads(){
db.collection('leads').orderBy('time','desc').onSnapshot(snap=>{
let t=document.getElementById('table');
t.innerHTML='<tr><th>Name</th><th>Phone</th><th>Status</th><th>Action</th></tr>';
snap.forEach(doc=>{
let l=doc.data();
t.innerHTML+=`<tr>
<td>${l.name}</td>
<td>${l.phone}</td>
<td><span class="badge ${l.status}">${l.status}</span></td>
<td><button onclick="whatsapp('${l.phone}')">WhatsApp</button></td>
</tr>`;
});
});
}

function whatsapp(phone){
window.open('https://wa.me/'+phone,'_blank');
}
</script></body>
</html>
